  <ellipse cx="40" cy="140" rx="35" ry="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="40" y="144" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" text-decoration="underline">tier_id</text>
  <line x1="65" y1="152" x2="80" y2="175" stroke="#64748b"/>

  <!-- 2. Users -->
  <g transform="translate(470, 175)" filter="url(#shadow)">
    <rect width="110" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="55" y="30" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Users</text>
  </g>
  <ellipse cx="470" cy="130" rx="35" ry="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
