    <rect width="380" height="110" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="20" y="28" fill="#c084fc" font-size="13" font-weight="700">AUTHENTICATION & RBAC ENTITIES (Rubric Item 12)</text>
    <rect x="20" y="45" width="90" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="70" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Roles</text>
    <polygon points="150,50 170,65 150,80 130,65" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="69" fill="#f59e0b" font-size="9" text-anchor="middle">has</text>
