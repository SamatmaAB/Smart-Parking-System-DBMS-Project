  <line x1="490" y1="144" x2="505" y2="175" stroke="#64748b"/>
  <ellipse cx="555" cy="130" rx="35" ry="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="555" y="134" fill="#cbd5e1" font-size="10" text-anchor="middle">email (UQ)</text>
  <line x1="545" y1="144" x2="535" y2="175" stroke="#64748b"/>

