  <ellipse cx="360" cy="775" rx="40" ry="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="360" y="779" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" text-decoration="underline">payment_id</text>
  <line x1="400" y1="775" x2="420" y2="775" stroke="#64748b"/>

