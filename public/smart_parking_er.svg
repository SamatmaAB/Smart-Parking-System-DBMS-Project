  <line x1="990" y1="845" x2="1000" y2="845" stroke="#64748b"/>

  <!-- 12. ChargingSessions -->
  <g transform="translate(1140, 780)" filter="url(#shadow)">
    <rect width="145" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="72" y="30" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">ChargingSessions</text>
