  <ellipse cx="945" cy="130" rx="40" ry="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="945" y="134" fill="#cbd5e1" font-size="10" text-anchor="middle">plate_no (UQ)</text>
  <line x1="935" y1="144" x2="925" y2="175" stroke="#64748b"/>

