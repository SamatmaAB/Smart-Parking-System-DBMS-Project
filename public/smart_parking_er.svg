    <text x="65" y="30" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">PricingRules</text>
  </g>
  <ellipse cx="1495" cy="105" rx="35" ry="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="1495" y="109" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" text-decoration="underline">rule_id</text>

