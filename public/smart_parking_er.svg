  </g>
  <ellipse cx="1225" cy="780" rx="35" ry="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="1225" y="784" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" text-decoration="underline">slot_id</text>
  <line x1="1245" y1="750" x2="1235" y2="765" stroke="#64748b"/>

  <!-- 8. Reservations -->
  <g transform="translate(460, 470)" filter="url(#shadow)">
    <rect width="130" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="65" y="30" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Reservations</text>
