  <!-- RELATIONSHIP DIAMONDS -->
  <!-- belongs to (Users - LoyaltyTiers) -->
  <polygon points="350,180 390,200 350,220 310,200" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="204" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">belongs to</text>
  <text x="290" y="195" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="410" y="195" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- owns (Users - Vehicles) -->
  <polygon points="720,180 760,200 720,220 680,200" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="204" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">owns</text>
  <text x="660" y="195" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="780" y="195" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- contains (ParkingLots - Zones) -->
  <polygon points="1280,310 1315,340 1280,370 1245,340" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1280" y="344" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">contains</text>
  <text x="1295" y="300" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="1295" y="395" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- has (Zones - Slots) -->
