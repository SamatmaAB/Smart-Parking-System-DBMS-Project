  <text x="1280" y="614" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">has</text>
  <text x="1295" y="570" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="1295" y="665" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- makes (Users - Reservations) -->
  <polygon points="520,350 550,380 520,410 490,380" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="384" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">makes</text>
  <text x="535" y="340" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="535" y="430" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- parks (Vehicles - ParkingSessions) -->
  <polygon points="930,450 965,480 930,510 895,480" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="930" y="484" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">parks</text>
  <text x="945" y="440" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="945" y="530" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- pays for (ParkingSessions - Payments) -->
  <polygon points="650,690 685,715 650,740 615,715" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="719" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">pays for</text>
  <text x="690" y="690" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="590" y="730" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- incurs (ParkingSessions - Violations) -->
  <polygon points="930,720 965,745 930,770 895,745" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="930" y="749" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">incurs</text>
  <text x="945" y="710" fill="#94a3b8" font-size="11" font-weight="700">1</text>
  <text x="945" y="790" fill="#94a3b8" font-size="11" font-weight="700">N</text>

  <!-- monitors (Slots - SensorLogs) -->
  <polygon points="1395,710 1425,725 1395,740 1365,725" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1395" y="729" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle">monitors</text>
</svg>
