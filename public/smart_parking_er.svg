  <!-- Title & Legend -->
  <text x="50" y="45" fill="#f8fafc" font-size="22" font-weight="800">SMART PARKING MANAGEMENT SYSTEM — CHEN ER DIAGRAM</text>
  <text x="50" y="70" fill="#94a3b8" font-size="13">PES University · Dept of CSE · Experiential Learning Level 3 MiniProject</text>
  <g transform="translate(1100, 30)">
    <rect x="0" y="0" width="110" height="32" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="55" y="21" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Entity</text>
    
    <polygon points="175,0 215,16 175,32 135,16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="175" y="21" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Relation</text>

    <ellipse cx="280" cy="16" rx="45" ry="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="280" y="20" fill="#34d399" font-size="11" text-anchor="middle" text-decoration="underline">PK Attr</text>

    <ellipse cx="395" cy="16" rx="45" ry="16" fill="#1e293b" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="395" y="20" fill="#c084fc" font-size="11" text-anchor="middle">Derived</text>
  </g>

  <!-- Relationship Lines -->
  <!-- Users to LoyaltyTiers -->
  <line x1="160" y1="200" x2="310" y2="200" stroke="#64748b" stroke-width="2"/>
  <line x1="390" y1="200" x2="480" y2="200" stroke="#64748b" stroke-width="2"/>
  
  <!-- Users to Vehicles -->
  <line x1="560" y1="200" x2="680" y2="200" stroke="#64748b" stroke-width="2"/>
  <line x1="760" y1="200" x2="860" y2="200" stroke="#64748b" stroke-width="2"/>

  <!-- ParkingLots to Zones -->
  <line x1="1280" y1="200" x2="1280" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="1280" y1="370" x2="1280" y2="440" stroke="#64748b" stroke-width="2"/>

  <!-- Zones to Slots -->
  <line x1="1280" y1="490" x2="1280" y2="580" stroke="#64748b" stroke-width="2"/>
  <line x1="1280" y1="640" x2="1280" y2="700" stroke="#64748b" stroke-width="2"/>

  <!-- ParkingLots to PricingRules -->
  <line x1="1350" y1="175" x2="1440" y2="175" stroke="#64748b" stroke-width="2"/>

  <!-- Users to Reservations -->
  <line x1="520" y1="225" x2="520" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="410" x2="520" y2="470" stroke="#64748b" stroke-width="2"/>

  <!-- Vehicles to Reservations -->
